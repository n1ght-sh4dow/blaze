name: blaze
description: A vibrant location-based collectible battle arena game.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0

  # Maps & Location
  google_maps_flutter: ^2.5.0
  location: ^5.0.0
  geolocator: ^9.0.0

  # State Management
  provider: ^6.1.0

  # UI & Animations
  lottie: ^2.7.0
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_linter: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/

  fonts:
    - family: BlazeFont
      fonts:
        - asset: assets/fonts/blaze_regular.ttf
        - asset: assets/fonts/blaze_bold.ttf
          weight: 700
